name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
        env:
          # macOS maps /var to /private/var with a system symlink. NokVault's
          # default-deny path policy intentionally rejects that ancestor, so
          # keep test fixtures under the runner's canonical workspace temp.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}

      - name: Vet
        run: go vet ./...

  # Analysis tools may require a newer toolchain than go.mod (GOTOOLCHAIN=local).
  # Install/run them on a current stable Go; project tests still use go-version-file.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install and run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install and run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build and validate
        run: npm run test:build

  package-homebrew:
    name: Homebrew package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install formula
        run: |
          brew tap jimididit/nokvault "file://$GITHUB_WORKSPACE"
          brew install jimididit/nokvault/nokvault

      - name: Verify package
        run: |
          nokvault --version | grep 'v0.5.0'
          brew test jimididit/nokvault/nokvault

  package-scoop:
    name: Scoop package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned Scoop runtime
        uses: actions/checkout@v5
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: .scoop-root/apps/scoop/current

      - name: Install and verify manifest
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force
          $env:SCOOP = "$PWD\.scoop-root"
          New-Item -ItemType Directory -Path "$env:SCOOP\shims", "$env:SCOOP\buckets" -Force | Out-Null
          & .\.scoop-root\apps\scoop\current\bin\scoop.ps1 install --no-update-scoop "$PWD\scoop\nokvault.json"
          if ($LASTEXITCODE -ne 0) {
            throw "NokVault Scoop installation failed with exit code $LASTEXITCODE"
          }

          $env:PATH = "$env:SCOOP\shims;$env:PATH"
          $version = nokvault --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'v0\.5\.0') {
            throw "Unexpected version output: $version"
          }
